<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D6A4D">
<meta name="apple-mobile-web-app-title" content="Boon Chores">
<title>Boon Chore Tracker</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF3EA; --surface:#FFFFFF; --surface-2:#F5F9F3; --ink:#1B2A31; --muted:#5A6A70; --line:#D3DFD1;
  --pine:#2D6A4D; --pine-ink:#FFFFFF; --sky:#2B7FC2; --sun:#E3A20F; --coral:#D5553C; --track:#DCE7D9;
  --shadow:0 2px 0 rgba(27,42,49,.08);
  --display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121C18; --surface:#1B2823; --surface-2:#22312B; --ink:#E7F0EA; --muted:#9DB0A7; --line:#2F4239;
    --pine:#4FA37A; --pine-ink:#0E1814; --sky:#5AA6E3; --sun:#F2BC3A; --coral:#EE7A62; --track:#2A3B34;
    --shadow:0 2px 0 rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#121C18; --surface:#1B2823; --surface-2:#22312B; --ink:#E7F0EA; --muted:#9DB0A7; --line:#2F4239;
  --pine:#4FA37A; --pine-ink:#0E1814; --sky:#5AA6E3; --sun:#F2BC3A; --coral:#EE7A62; --track:#2A3B34;
  --shadow:0 2px 0 rgba(0,0,0,.3);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;min-height:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.15}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;box-shadow:var(--shadow)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sec-head h2{font-size:1.35rem}
.sub{color:var(--muted);margin:0;font-size:.95rem}
.hint{color:var(--muted);font-size:.9rem;margin:10px 0 0}
.btn{border:0;border-radius:14px;padding:12px 18px;min-height:48px;font-weight:800;background:var(--pine);color:var(--pine-ink);transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{padding:8px 12px;min-height:40px;font-size:.9rem}
.btn.warn{background:var(--coral);color:#fff}
.btn.block{width:100%}
input,select{background:var(--surface-2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
label{display:block;font-weight:700;font-size:.92rem}
label > input, label > select{margin-top:4px;font-weight:600}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.row > *{flex:1 1 140px}
.money{font-family:var(--display);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;z-index:50;max-width:90vw;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}

/* Chooser & PIN */
.center{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
.logo{font-family:var(--display);font-size:3rem;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.logo span{color:var(--pine)}
.choices{display:grid;gap:12px;margin-top:24px;width:min(420px,100%)}
.choice{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.choice .e{font-size:2rem}
.choice b{display:block;font-family:var(--display);font-size:1.2rem;font-weight:600}
.choice small{color:var(--muted)}
.pinbox{width:min(360px,100%);margin-top:18px;display:grid;gap:12px}
.pinbox input{text-align:center;font-size:1.6rem;letter-spacing:.4em}
.seg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:800}
.seg button.on{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}

/* Kid */
.kid-head{display:flex;align-items:center;gap:14px}
.kid-head > div{flex:1}
.kid-head h1{font-size:2rem}
.avatar{font-size:2.6rem;width:72px;height:72px;border-radius:22px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.picker button{border:2px solid var(--line);background:var(--surface-2);border-radius:16px;padding:8px 4px;display:grid;justify-items:center;gap:2px;font-size:.8rem;font-weight:700}
.picker button span{font-size:2rem}
.picker button.on{border-color:var(--pine);background:var(--surface)}
.banner{background:var(--sun);color:#2A1E00;border-radius:16px;padding:12px 16px;margin-top:14px;font-weight:700}
.goal{border-color:var(--pine)}
.goal.won{background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box, repeating-linear-gradient(45deg,var(--sun) 0 10px,var(--pine) 10px 20px) border-box;border-color:transparent}
.goal-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:700;font-size:3.2rem;line-height:1}
.bonus{text-align:right;color:var(--muted);font-weight:700;font-size:.9rem}
.bonus b{display:block;color:var(--pine);font-family:var(--display);font-size:1.6rem;font-weight:600}
.goal-msg{font-family:var(--display);font-size:1.3rem;font-weight:600;margin:8px 0 12px}
.inline{display:flex;align-items:center;gap:10px;font-weight:700}
.inline select{width:auto;flex:1;margin:0}

.trail{position:relative;height:74px;margin-top:14px}
.trail::before{content:"";position:absolute;left:0;right:0;top:44px;height:14px;border-radius:99px;background:var(--track)}
.trail-fill{position:absolute;left:0;top:44px;height:14px;border-radius:99px;background:var(--pine);width:calc(100% * var(--f));transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.walker{position:absolute;top:0;font-size:2.6rem;line-height:1;left:calc((100% - 96px) * var(--f));transition:left .6s cubic-bezier(.3,1.4,.5,1);animation:bob 1.6s ease-in-out infinite}
.flag{position:absolute;right:0;top:4px;font-size:2.2rem;line-height:1}
.walker.victory{animation:victory 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes victory{0%{transform:translateY(0) rotate(0) scale(1)}25%{transform:translateY(-22px) rotate(-12deg) scale(1.15)}50%{transform:translateY(0) rotate(0) scale(1)}70%{transform:translateY(-12px) rotate(360deg) scale(1.1)}100%{transform:translateY(0) rotate(360deg) scale(1)}}

.goal-set .money-in{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:2.4rem;font-weight:600}
.goal-set .money-in input{font-family:var(--display);font-size:2.2rem;font-weight:600;max-width:200px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chips button{border:2px solid var(--line);background:var(--surface-2);border-radius:99px;padding:8px 14px;font-weight:800}

.feed li.wrap{flex-wrap:wrap}
.feed li.wrap > span:first-child{flex:1 1 100%}
.feed li.wrap .btn{flex:0 0 auto}
.card.warning{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 12%,var(--surface))}
.card.warning h3{font-size:1.2rem}
.card.warning p{margin:6px 0 0}
.card.warning.seen{background:var(--surface)}
.challenge{border-color:var(--coral);background:var(--surface)}
.challenge h3{font-size:1.2rem;color:var(--coral)}
.challenge p{margin:6px 0 0}

.checks{display:grid;gap:8px}
.check{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--surface-2);border-radius:16px;padding:12px}
.check .box{width:34px;height:34px;flex:none;border-radius:10px;border:3px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--pine-ink)}
.check.on{border-color:var(--pine)}
.check.on .box{background:var(--pine);border-color:var(--pine)}
.check b{display:block}
.check small{color:var(--muted)}
.streak{font-weight:800;color:var(--coral)}

.chore{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:12px 0;border-top:2px solid var(--line)}
.chore:first-of-type{border-top:0}
.chore b{display:block}
.chore small{color:var(--muted);font-weight:600}
.chore{row-gap:6px}
.c-count{grid-column:1 / -1;font-size:.82rem}
.tag{display:inline-block;font-size:.75rem;font-weight:800;border-radius:99px;padding:1px 8px;margin-right:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.tag.mine{background:var(--sky);border-color:var(--sky);color:#fff}
.c-val{font-family:var(--display);font-weight:600;font-size:1.25rem;color:var(--pine)}

.buckets{display:grid;grid-template-columns:1fr;gap:10px}
.bucket{border-radius:18px;padding:0;border:2px solid var(--line);background:var(--surface-2);border-top:8px solid var(--c);overflow:hidden}
.bucket-head{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;background:none;border:0;text-align:left;font:inherit;color:inherit}
button.bucket-head{cursor:pointer}
.bh-name{flex:1;min-width:0}
.bucket-head h3{display:block;font-size:1.1rem}
.bucket-head h3 small{margin-left:6px}
.bucket-head p{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
.bh-total{font-size:1.5rem;white-space:nowrap}
.chev{color:var(--muted);font-size:1.1rem;flex:none}
.bucket-body{padding:0 14px 14px}
.bucket h3 small{font-family:var(--body);font-size:.8rem;color:var(--muted);font-weight:800}
.bucket .money{font-size:1.9rem}
.bucket p{margin:4px 0;font-size:.9rem;color:var(--muted)}
.bucket label{margin-top:8px;font-size:.82rem}
.b-spend{--c:var(--sun)} .b-save{--c:var(--sky)} .b-invest{--c:var(--pine)} .b-give{--c:var(--coral)}
.sgoal{margin-top:8px}
.sgoal .top{display:flex;justify-content:space-between;font-weight:700;font-size:.92rem;gap:8px}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--sky);border-radius:99px}
.mini-form{display:grid;grid-template-columns:1fr 90px auto;gap:6px;margin-top:10px}
.mini-form input{min-height:40px;padding:6px 10px}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.badge{text-align:center;border-radius:16px;padding:10px 6px;background:var(--surface-2);border:2px solid var(--line);font-size:.78rem;font-weight:800}
.badge span{display:block;font-size:1.9rem}
.badge.locked{opacity:.45;filter:grayscale(1)}
.badge small{display:block;font-weight:700;font-size:.68rem;line-height:1.2;margin-top:2px}

.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.feed li:first-child{border-top:0}
.feed .amt{font-family:var(--display);font-weight:600;white-space:nowrap}
.pos{color:var(--pine)} .neg{color:var(--coral)} .struck{text-decoration:line-through;color:var(--muted)}
.feed small{color:var(--muted)}

/* Board */
body[data-mode="display"]{overflow:hidden}
.board{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:10px 14px;gap:8px}
.board-head{display:flex;align-items:baseline;gap:16px}
.board-head h1{font-size:clamp(1.3rem,3vw,2rem);font-weight:700}
.board-head .when{flex:1;color:var(--muted);font-weight:700;font-size:clamp(.85rem,1.8vw,1.05rem)}
.board-head .when b{color:var(--coral)}
.corner{border:0;background:transparent;color:var(--muted);font-size:1.6rem;padding:4px 10px}
.lanes{flex:1;display:grid;gap:8px;grid-auto-rows:1fr;min-height:0}
.lane{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:6px 12px;display:grid;grid-template-columns:minmax(130px,1.1fr) 3fr minmax(120px,1fr);column-gap:12px;align-items:center;min-height:0}
.lane.won{border-color:var(--sun);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 35%,transparent)}
.lane-who{display:flex;align-items:center;gap:10px}
.lane-who h2{font-size:clamp(1.05rem,2.4vw,1.6rem)}
.lane-cr{font-size:clamp(1.6rem,4vw,2.4rem)}
.lane .trail{margin-top:0;height:50px}
.lane .trail::before,.lane .trail-fill{top:30px;height:11px}
.lane .walker{font-size:1.9rem;left:calc((100% - 72px) * var(--f))}
.lane .flag{font-size:1.6rem;top:2px}
.lane-num{text-align:right}
.lane-num b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,3.4vw,2.2rem);line-height:1}
.lane-num span{color:var(--muted);font-weight:700;font-size:.8rem}
.lane-num em{display:inline;margin-left:6px;font-style:normal;font-family:var(--display);font-weight:600;font-size:1rem;color:var(--pine)}
.won-note{font-family:var(--display);font-weight:600;color:var(--sun)}
body[data-mode="display"] .walker,body[data-mode="display"] .walker.victory{animation:none}
body[data-mode="display"] .walker.cheer{animation:victory 1.4s ease-in-out 2}
.ticker{color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.85rem}
.ticker b{color:var(--ink)}
@media (max-width:640px){
  body[data-mode="display"]{overflow:auto}
  .lane{grid-template-columns:1fr auto;grid-template-rows:auto auto}
  .lane .lane-track{grid-column:1 / -1;grid-row:2}
}

/* Parent */
.p-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.p-head h1{font-size:1.7rem}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:4px}
.tabs button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:800;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 16px;margin:10px 0}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;text-align:right;font-family:var(--display);font-weight:600}
.kv .total{border-top:2px solid var(--line);padding-top:6px;color:var(--ink)}
.handoff{background:var(--surface-2);border-radius:14px;padding:12px;margin-top:10px}
.handoff b{font-family:var(--display);font-weight:600}
.flag-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.flag-row:first-of-type{border-top:0}
.set-block{border-top:2px solid var(--line);padding-top:12px;margin-top:12px}
.set-block:first-of-type{border-top:0;margin-top:0;padding-top:0}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.empty{color:var(--muted);font-weight:700;margin:6px 0}
@media (prefers-reduced-motion: reduce){
  .walker,.walker.victory{animation:none}
  .trail-fill,.walker{transition:none}
}

.code{font-family:var(--display);font-weight:700;font-size:3rem;letter-spacing:.18em;text-align:center;margin:10px 0}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.8rem;font-weight:800;border:2px solid var(--line)}
.pill.on{border-color:var(--pine);color:var(--pine)}

/* Game: creatures, levels, wardrobe */
.cr{position:relative;display:inline-block;line-height:1}
.cr .hat{position:absolute;left:50%;top:-.38em;transform:translateX(-50%);font-size:.55em;font-style:normal;line-height:1;pointer-events:none}
.cr .hat-shades{top:.18em;font-size:.5em}
.cr .hat-bow{left:78%;top:-.18em;font-size:.45em}
.cr .hat-wand{left:auto;right:-.42em;top:.3em;transform:rotate(18deg);font-size:.5em}
.cr.stage-2{transform:scale(1.06)}
.cr.stage-3{transform:scale(1.1);filter:drop-shadow(0 0 5px color-mix(in srgb,var(--sun) 80%,transparent))}
.cr.stage-4{transform:scale(1.14);animation:aura 2.6s ease-in-out infinite}
@keyframes aura{0%,100%{filter:drop-shadow(0 0 6px #B388FF) drop-shadow(0 0 2px var(--sun))}50%{filter:drop-shadow(0 0 12px #FFD54F) drop-shadow(0 0 3px #B388FF)}}
.avatar.stage-2{border-color:var(--sky);box-shadow:0 0 0 3px color-mix(in srgb,var(--sky) 35%,transparent)}
.avatar.stage-3{border-color:var(--sun);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 40%,transparent),0 0 16px color-mix(in srgb,var(--sun) 45%,transparent)}
.avatar.stage-3 .cr{animation:bob 1.8s ease-in-out infinite}
.avatar.stage-4{border-color:transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(#E3A20F,#D5553C,#9B6BD6,#2B7FC2,#2D6A4D,#E3A20F) border-box;border-width:3px}
.title-chip{display:inline-block;font-weight:800;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:0 8px;margin-right:4px;font-size:.82rem}
.xpbar{display:flex;align-items:center;gap:10px;margin-top:12px}
.lvl-badge{display:inline-block;font-family:var(--display);font-weight:700;background:var(--ink);color:var(--bg);border-radius:10px;padding:2px 9px;font-size:.95rem;white-space:nowrap}
.xp-track{flex:1;height:14px;border-radius:99px;background:var(--track);overflow:hidden}
.xp-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sun),color-mix(in srgb,var(--sun) 60%,var(--coral)));transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.xp-num{font-weight:800;font-size:.85rem;color:var(--muted);white-space:nowrap}
.pill.boost{border-color:var(--sun);color:var(--ink);background:color-mix(in srgb,var(--sun) 25%,transparent)}
.tag.star{white-space:nowrap;background:var(--sun);border-color:var(--sun);color:#2A1E00}
.chore.cotd{background:linear-gradient(90deg,color-mix(in srgb,var(--sun) 16%,transparent),transparent 70%);border-radius:12px;padding-left:8px;padding-right:4px}
.c-val{text-align:right}
.c-val small{display:block;font-family:var(--body);font-weight:800;font-size:.78rem;color:var(--muted)}
.bonus small{display:block;font-weight:800}
.wtabs{justify-content:flex-start}
.wtabs button{padding:6px 12px;font-size:.88rem}
.picker button.locked{opacity:.5;filter:grayscale(.8)}
.picker button small{font-size:.7rem;color:var(--muted);text-align:center}
.picker button[disabled]{cursor:default}
.banner.freeze{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sky);color:#fff}
.banner.freeze .btn{color:#fff;border-color:rgba(255,255,255,.6)}
.check-label{display:flex;align-items:center;gap:8px;font-weight:700;min-height:46px;flex:0 0 auto}
.check-label input{width:22px;height:22px;min-height:0;margin:0;flex:none;accent-color:var(--pine)}
.lvl-cr{font-size:1.4rem;vertical-align:middle}

/* Level-up celebration */
.overlay{position:fixed;inset:0;z-index:45;background:color-mix(in srgb,var(--ink) 55%,transparent);display:grid;place-items:center;padding:16px;animation:fadein .25s ease-out}
.lu-card{background:var(--surface);border:3px solid var(--sun);border-radius:26px;padding:22px;width:min(420px,100%);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.lu-cr{font-size:4.5rem;line-height:1.1;margin:6px 0 4px}
.lu-kicker{margin:0;font-weight:800;color:var(--coral);text-transform:uppercase;letter-spacing:.12em;font-size:.85rem}
.lu-card h2{font-size:2.6rem;margin-bottom:6px}
.lu-list{list-style:none;padding:0;margin:12px 0 16px;display:grid;gap:8px;text-align:left}
.lu-list li{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;background:var(--surface-2);border-radius:14px;padding:8px 12px}
.lu-list li span{grid-row:span 2;font-size:1.8rem}
.lu-list small{color:var(--muted);font-weight:700}
@keyframes fadein{from{opacity:0}}
@keyframes pop{from{transform:scale(.7);opacity:0}}

/* Battles */
.battles{border-color:color-mix(in srgb,var(--coral) 50%,var(--line))}
.bcard{border:2px solid var(--line);border-radius:18px;padding:12px;margin-top:10px;background:var(--surface-2)}
.bcard.pending{border-style:dashed}
.bcard.active{border-color:var(--coral)}
.bcard.confirming{border-color:var(--sun)}
.b-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.b-head b{font-family:var(--display);font-weight:600;font-size:1.15rem}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:10px 0;text-align:center}
.vs > div{display:grid;justify-items:center;gap:2px}
.vs .cr{font-size:2.4rem}
.vs-x{font-family:var(--display);font-weight:700;color:var(--coral)}
.b-score{font-family:var(--display);font-weight:700;font-size:1.5rem}
.b-score small{font-family:var(--body);font-size:.75rem;color:var(--muted)}
.b-result{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:4px 0 8px}
.tt-big{font-family:var(--display);font-weight:700;font-size:3rem;text-align:center;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.bcard .row{margin-top:8px}
.builder{border:2px solid var(--line);border-radius:18px;padding:12px;background:var(--surface-2)}
.builder h3{font-size:1.05rem;margin:4px 0 8px}
.builder h3 + .seg{margin-bottom:4px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.mode{display:grid;grid-template-columns:auto 1fr;column-gap:8px;text-align:left;align-items:center;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 10px}
.mode span{grid-row:span 2;font-size:1.6rem}
.mode small{color:var(--muted);font-weight:700;font-size:.75rem;line-height:1.25}
.mode.on{border-color:var(--pine);box-shadow:0 0 0 2px var(--pine)}
.mode[disabled]{opacity:.5;cursor:default}
.feed.recent{margin-top:10px}

/* Board: battles, levels */
.battle-strip{display:flex;gap:10px;flex-wrap:wrap}
.bs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:2px solid var(--coral);border-radius:16px;padding:6px 14px;font-size:clamp(.9rem,2vw,1.15rem)}
.bs .cr{font-size:1.6em}
.bs-mode{font-family:var(--display);font-weight:600;color:var(--coral)}
.bs-score{font-family:var(--display);font-weight:700}
.bs em{font-style:normal;font-family:var(--display);font-weight:600;color:var(--sun)}
.cotd-chip{display:inline-block;margin-left:10px;background:var(--sun);color:#2A1E00;border-radius:99px;padding:1px 10px;font-weight:800}
.lane-title{display:block;color:var(--muted);font-weight:800;font-size:.8rem}
.lane-who .lvl-badge{font-size:.8rem;padding:1px 7px}
body[data-mode="display"] .lane-cr.cheer .cr{animation:victory 1.4s ease-in-out 2}

/* Goal trail styles */
.trail.tr-rainbow::before{background:linear-gradient(90deg,#FF6B6B,#FFD93D,#6BCB77,#4D96FF,#9B72CF);opacity:.35}
.trail.tr-rainbow .trail-fill{background:linear-gradient(90deg,#FF6B6B,#FFD93D,#6BCB77,#4D96FF,#9B72CF)}
.trail.tr-stars::before{background:radial-gradient(circle,#fff 1px,transparent 1.5px) 0 0/12px 7px,#1B1F4B}
.trail.tr-stars .trail-fill{background:linear-gradient(90deg,#4B3F9E,#9B72CF)}
.trail.tr-lava::before{background:linear-gradient(90deg,#5A1A0A,#8A2A0A)}
.trail.tr-lava .trail-fill{background:linear-gradient(90deg,#FF8A00,#FF3D00)}
.trail.tr-ice::before{background:linear-gradient(90deg,#DDF3FF,#BFE6FA)}
.trail.tr-ice .trail-fill{background:linear-gradient(90deg,#7FD1FF,#2B9FE6)}

/* Screen themes (unlocked by level, chosen in the wardrobe) */
body[data-kidtheme="ocean"]{--bg:#E3F0F8;--surface-2:#F0F7FB;--pine:#1F6FA8;--track:#D0E3EF;--line:#C9DCE8}
body[data-kidtheme="forest"]{--bg:#E2EEDD;--surface-2:#F1F7EE;--pine:#2F6B2F;--track:#CFE0C8;--line:#C7D9BF}
body[data-kidtheme="space"]{--bg:#E8E5F6;--surface-2:#F3F1FB;--pine:#5B43B8;--track:#D9D3EE;--line:#D2CBEA}
body[data-kidtheme="candy"]{--bg:#FBE8F0;--surface-2:#FDF3F8;--pine:#B83A72;--track:#F2D2E0;--line:#EDCADA}
body[data-kidtheme="gold"]{--bg:#FAF2DA;--surface-2:#FDF8EA;--pine:#8A5F04;--track:#EEE0B6;--line:#E6D7A8}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) body[data-kidtheme="ocean"]{--bg:#0E1A22;--surface:#15232D;--surface-2:#1B2C37;--pine:#5AA6E3;--track:#243745;--line:#2A3F4E}
  :root:not([data-theme="light"]) body[data-kidtheme="forest"]{--bg:#0F1A10;--surface:#162317;--surface-2:#1D2D1E;--pine:#6CBF6A;--track:#253A26;--line:#2D422E}
  :root:not([data-theme="light"]) body[data-kidtheme="space"]{--bg:#110E21;--surface:#1A162E;--surface-2:#221D3A;--pine:#A28CF0;--track:#2E2850;--line:#352E57}
  :root:not([data-theme="light"]) body[data-kidtheme="candy"]{--bg:#21111A;--surface:#2B1822;--surface-2:#34202B;--pine:#F07AAE;--track:#45293A;--line:#4A2E3E}
  :root:not([data-theme="light"]) body[data-kidtheme="gold"]{--bg:#1C160A;--surface:#261F10;--surface-2:#2E2616;--pine:#F2BC3A;--track:#3D321A;--line:#42371E}
}

/* Quests, rewards, family goal */
.quests{display:grid;gap:8px}
.quest{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.quest.done{border-color:var(--pine)}
.quest .q-e{font-size:1.6rem}
.quest b{display:block;font-size:.95rem}
.quest small{color:var(--muted);font-weight:700}
.quest .bar i{background:var(--sun)}
.quest.done .bar i{background:var(--pine)}
.q-xp{font-family:var(--display);font-weight:600;color:var(--pine);white-space:nowrap}
.fambar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 14px;margin-top:12px}
.fambar.compact{padding:6px 12px}
.fambar.done{border-color:var(--sun);box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 35%,transparent)}
.fb-name{font-weight:800}
.fb-track{flex:1 1 140px;height:14px;border-radius:99px;background:var(--track);overflow:hidden}
.fb-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sky),var(--pine));transition:width .6s ease}
.fambar.done .fb-track i{background:linear-gradient(90deg,var(--sun),var(--coral))}
.fb-num{font-weight:800;font-size:.85rem;color:var(--muted);white-space:nowrap}
.board .fambar{margin-top:0}

/* Battle modes: bingo, teams, raid */
.bingo{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 10px}
.bingo .sq{min-height:58px;display:grid;place-items:center;text-align:center;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-weight:800;font-size:.78rem;padding:4px;line-height:1.2}
.bingo .sq.on{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.team-crs{display:flex;justify-content:center;gap:2px}
.team-crs .cr{font-size:1.9rem}
.raid{text-align:center;margin:8px 0}
.raid .boss{display:grid;justify-items:center;font-size:3rem;line-height:1.1}
.raid .boss b{font-family:var(--display);font-size:1.1rem;font-weight:600}
.raid .hp{height:16px;border-radius:99px;background:var(--track);overflow:hidden;margin:8px 0 4px}
.raid .hp i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),#E3A20F);transition:width .6s ease}
.bcard.judging{border-color:var(--sky)}
.btn-pair{display:flex;gap:6px;flex:0 0 auto}
.sg-del{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:.85rem;padding:2px 6px;margin-left:4px;border-radius:8px;min-height:28px}
.sg-del:hover,.sg-del:focus-visible{color:var(--coral)}
/* Full-screen chore mode */
.fx-open{display:inline-block;margin:4px 0 2px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:99px;padding:2px 10px;font-weight:800;font-size:.8rem}
.fx-open.pr{justify-self:start;margin:-2px 0 4px 8px}
.took{color:var(--muted);font-weight:700}
.focus{position:fixed;inset:0;z-index:44;background:var(--bg);overflow:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.focus > *{width:min(560px,100%)}
.fx-top{display:flex;justify-content:space-between;align-items:center}
.tmap{gap:8px}
.rush h2{font-size:1.8rem}
.rr-clock{font-size:clamp(4.5rem,22vw,8rem)}
.rr-up{font-size:1.6rem;font-weight:800}
.rr-count{font-size:1.15rem;font-weight:700;display:flex;flex-direction:column;gap:8px;align-items:center}
.rr-count input{font-size:2.4rem;text-align:center;width:min(220px,100%);font-weight:800}
.tm-score{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tm-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:var(--card);border:2px solid var(--c);font-weight:700}
.tm-chip i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.tm-svg{width:100%;height:auto;display:block;background:#cfe8f3;border-radius:16px}
.tmap .tm-svg{max-height:56vh}
.tm-ct[data-act]{cursor:pointer}
.tm-can polygon{animation:tmglow 1.2s ease-in-out infinite alternate}
@keyframes tmglow{to{fill:#ffe066;stroke:#ffe066}}
@media (prefers-reduced-motion:reduce){.tm-can polygon{animation:none}}
.tm-border{fill:none;stroke:#6b5f45;stroke-width:.7;stroke-linejoin:round;pointer-events:none}
.tm-coast{fill:none;stroke:#4d7f99;stroke-width:1.4;stroke-linejoin:round;pointer-events:none}
.tm-lbl{font:700 4.2px system-ui,sans-serif;fill:#3b3526;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.tm-lbl.on{fill:#fff;font-size:3.6px}
.tm-emo{font-size:8px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tm-mini{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;margin:8px 0}
.tm-panel{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.tm-now{font-size:1.15rem}
.tm-chore{display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.3rem}
.tm-chore .fx-ic{font-size:2.6rem;margin:0}
.tmap .tm-clock{font-size:2.2rem}
.fx-ic{font-size:4.5rem;line-height:1.1;margin-top:6px}
.focus h2{font-size:2rem}
.fx-clock{font-family:var(--display);font-weight:700;font-size:clamp(3.5rem,14vw,6rem);line-height:1;font-variant-numeric:tabular-nums}
.fx-bar{height:14px;border-radius:99px;background:var(--track);overflow:hidden}
.fx-fill{display:block;height:100%;width:0;border-radius:99px;background:var(--pine);transition:width 1s linear}
.fx-fill.over{background:var(--coral)}
.fx-goal small{color:var(--muted);font-weight:800}
.fx-steps{text-align:left;margin-top:6px}
.fx-steps .check{padding:16px;font-size:1.15rem}
.fx-steps .check .box{width:40px;height:40px}
.fx-note{text-align:left}
.fx-done{min-height:60px;font-size:1.2rem;margin-top:auto}
.c-ic{display:inline-block;width:1.45em;text-align:center;margin-right:4px;font-style:normal}
.check .c-ic{font-size:1.15em}
.chore .c-ic{font-size:1.25em}
.bingo .sq-ic{display:block;font-size:1.4rem;line-height:1.1}
.icon-pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.icon-pick button{border:2px solid var(--line);background:var(--surface-2);border-radius:10px;min-width:42px;min-height:42px;font-size:1.2rem;padding:2px 6px}
.icon-pick button:first-of-type{font-size:.8rem;font-weight:800}
.icon-pick button.on{border-color:var(--pine);box-shadow:0 0 0 2px var(--pine)}
.qc{display:grid;gap:6px;margin-top:8px}
.qc-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qc-row span{flex:1 1 120px}
.feed li.has-qc{align-items:flex-start}

@media (prefers-reduced-motion: reduce){
  .cr.stage-4,.avatar.stage-3 .cr,.overlay,.lu-card{animation:none}
  .xp-track i{transition:none}
}

/* Savings split (kid view) */
.split{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.split-title{margin:0 0 4px;font-weight:800;font-size:.85rem}
.split-row{display:grid;grid-template-columns:1fr 62px auto;align-items:center;gap:6px;margin-top:6px;font-size:.9rem;font-weight:700}
.split-row .nm{min-width:0;line-height:1.2}
.split-row .proj{display:block;color:var(--pine);font-weight:800;font-size:.78rem;min-height:1em}
.split-row input{min-height:36px;padding:4px 6px;text-align:center}
.split-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-weight:800;font-size:.9rem}
.split-foot .bad{color:var(--coral)}

/* Leaderboard inside the parent page */
.pboard .board{height:auto;padding:0;margin-top:14px}
.pboard .board-head h1{display:none}
.pboard .lanes{grid-auto-rows:auto}

/* Confirm "I did it" / say what it was */
.confirm{grid-column:1 / -1;background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;margin-top:4px}
.confirm label{font-size:.9rem}
.chk{display:flex;align-items:center;gap:8px;flex:0 0 auto;min-height:46px;cursor:pointer}
.chk input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;margin:0;accent-color:var(--pine)}

/* Set balances (parent page) */
.adjust{margin-top:12px;border-top:2px solid var(--line);padding-top:12px}
.adjust h3{font-size:1.1rem;margin-bottom:4px}
.adjust h4{font-size:1rem;margin:12px 0 6px}
.adjust h4 small{display:block;font-family:var(--body);font-size:.85rem;font-weight:700;color:var(--muted)}

.tab-h{margin:18px 0 0;font-size:1.3rem}

/* Kid views (parent page) */
.kid-list{display:grid;gap:10px}
.asbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:10px 12px;border-radius:14px;background:var(--sun);color:#2A1E00;font-weight:700}
.asbar .btn.ghost{color:#2A1E00;border-color:#2A1E00}

/* Drag to reorder chores (settings) */
.drag-handle{flex:0 0 auto;align-self:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:1.5rem;line-height:1;padding:10px 6px;color:var(--muted)}
.drag-hint{margin:0 0 10px}
[data-drag].dragging{opacity:.45}
[data-drag].drop-before{box-shadow:inset 0 4px 0 0 var(--pine)}
[data-drag].drop-after{box-shadow:inset 0 -4px 0 0 var(--pine)}
.people{display:grid;gap:6px}
.p-head,.p-row{display:grid;grid-template-columns:minmax(66px,1.3fr) 28px 40px 54px minmax(74px,1fr) 30px;gap:3px;align-items:center}
.p-head{font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;padding:0 2px}
.p-head span:nth-child(2),.p-head span:nth-child(3),.p-head span:nth-child(4){text-align:center}
.p-row input{min-height:38px;padding:6px 8px;font-size:.88rem;border-radius:10px}
.p-row input[type=number]{padding:6px 2px;text-align:center;-moz-appearance:textfield;appearance:textfield}
.p-row input[type=number]::-webkit-inner-spin-button,.p-row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.p-row input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;margin:0 auto;accent-color:var(--pine)}
.p-na{text-align:center;color:var(--muted)}
.p-row .p-rm{min-height:38px;padding:0;font-size:1.4rem;line-height:1}
.p-email{grid-column:1 / -1;font-size:.8rem;margin-top:2px}
@media (max-width:380px){.p-head,.p-row{grid-template-columns:minmax(56px,1.3fr) 26px 38px 50px minmax(64px,1fr) 28px}}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-head{display:flex;align-items:center;gap:2px}
.set-head .drag-handle{padding:6px 4px}
.set-open{flex:1 1 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:6px 4px;background:none;border:0;border-radius:10px;text-align:left}
.set-open b{display:block;font-size:1rem;line-height:1.2}
.set-open small{display:block;color:var(--muted);font-size:.8rem;line-height:1.3}
.set-open .chev{flex:0 0 auto;color:var(--muted);font-size:1.5rem;line-height:1;transition:transform .15s}
.set-row.editing .set-open .chev{transform:rotate(90deg)}
.set-row.editing{border-left:4px solid var(--pine);padding-left:6px;margin-left:-10px}
.set-edit{padding:2px 0 12px}
.set-edit .set-foot{margin-top:10px}
.set-foot > *{flex:0 0 auto}
.guide{margin-top:4px}
.g-row+.g-row{border-top:1px solid var(--line)}
.g-head{display:flex;align-items:center;gap:2px}
.g-on{flex:0 0 auto;display:flex;align-items:center;min-height:44px;padding:0 6px 0 2px;cursor:pointer}
.g-on input{width:22px;height:22px;min-height:0;padding:0;margin:0;accent-color:var(--pine)}
.g-open{flex:1 1 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:6px 4px;background:none;border:0;border-radius:10px;text-align:left}
.g-open b{display:block;font-size:.98rem;line-height:1.25}
.g-open small{display:block;color:var(--muted);font-size:.8rem;line-height:1.3}
.g-open .pill{font-size:.72rem;vertical-align:middle}
.g-open .chev{flex:0 0 auto;color:var(--muted);font-size:1.5rem;line-height:1;transition:transform .15s}
.g-row.open .g-open .chev{transform:rotate(90deg)}
.g-body{padding:0 6px 12px;font-size:.9rem}
.g-body p{margin:6px 0}
.g-body ul{margin:2px 0 0 18px;padding:0}
.g-body li{margin:3px 0}
.g-body li small{color:var(--muted)}
</style>
</head>
