name: Deploy to Firebase

# The live site updates on every push to main and on every push to a
# claude/... branch (the branches Claude Code works on). Before deploying,
# the run checks that the pushed commit includes whatever is live right now,
# so a branch that started from older code can't quietly undo a change.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if this would undo changes that are live now"
        type: boolean
        default: false

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # lets GitHub prove its identity to Google (no key file)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the live commit can be compared

      - name: Check that this commit includes what is live now
        if: ${{ !inputs.force }}
        run: |
          site="https://$(jq -r .projects.default .firebaserc).web.app"
          live="$(curl -sf --max-time 15 "$site/version.json?t=$(date +%s)" | jq -r '.commit // empty' || true)"
          if ! [[ "$live" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No live commit recorded at $site/version.json yet; skipping the check."
          elif ! git cat-file -e "$live^{commit}" 2>/dev/null; then
            echo "::warning::Live commit $live is not in this repository's history; skipping the check."
          elif ! git merge-base --is-ancestor "$live" HEAD; then
            echo "::error::The live site is at commit $live, which '$GITHUB_REF_NAME' does not include. Merge the branch that has it (named under 'branch' in $site/version.json), or main if it is already there, into this branch and push again. Nothing was deployed."
            exit 1
          else
            echo "OK: this commit includes the live commit $live."
          fi

      - name: Record this commit in the site for the check above
        run: |
          jq -n --arg commit "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{commit: $commit, branch: $branch, deployedAt: $deployedAt}' > public/version.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Write functions/.env from GitHub secret
        env:
          PARENT_EMAILS: ${{ secrets.PARENT_EMAILS }}
        run: printf 'PARENT_EMAILS=%s\n' "$PARENT_EMAILS" > functions/.env

      - name: Sign in to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy hosting, rules, and functions
        run: npx --yes firebase-tools@latest deploy --non-interactive --force
